<nav class="navbar" [class.navbar--solid]="isScrolled()" aria-label="Primary">
  <div class="navbar__inner container">
    <a routerLink="/" class="navbar__brand" (click)="closeMenu()" aria-label="Avorn Bible home">
      <span class="navbar__brand-mark">✦</span>
      <span class="navbar__brand-text">Avorn Bible</span>
    </a>

    <ul class="navbar__links navbar__links--desktop">
      <li>
        <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      </li>
      <li>
        <a routerLink="/bible" routerLinkActive="is-active">Bible</a>
      </li>
    </ul>

    <button
      type="button"
      class="navbar__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation menu"
    >
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
    </button>
  </div>

  <ul id="mobile-menu" class="navbar__links navbar__links--mobile" [class.is-open]="isMenuOpen()">
    <li>
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
    </li>
    <li>
      <a routerLink="/bible" routerLinkActive="is-active" (click)="closeMenu()">Bible</a>
    </li>
  </ul>
</nav>
